<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acceso | Digital Lab</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#03070a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../styles.css?v=20261019a">
  <link rel="stylesheet" href="login.css?v=20261019a">
</head>
<body class="lg">
  <header class="lg-top">
    <div class="wrap">
      <a class="lg-brand" href="../" aria-label="Digital Lab, inicio">
        <img src="../favicon.svg" alt="" width="34" height="34">
        <span>DIGITAL LAB</span>
      </a>
    </div>
  </header>

  <main class="lg-main wrap">
    <form class="lg-card form" data-login novalidate>
      <p class="eyebrow"><i></i>Panel de administración</p>
      <h1>Acceso del equipo</h1>
      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="username" maxlength="254" required>
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" maxlength="200" required>
      </label>
      <!-- Campo trampa contra robots: las personas no lo ven -->
      <div class="form__trap" aria-hidden="true"><label>No rellenar <input name="web" type="text" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn btn--primary" type="submit" data-login-btn>Entrar</button>
      <p class="lg-msg" data-login-msg role="alert" hidden></p>
    </form>
  </main>

  <script src="login.js?v=20261019a"></script>
</body>
</html>
